<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ödəniş nəticəsi | Quba Tiny House</title><style>body{font-family:Arial,sans-serif;background:#f7f4ec;color:#253129;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.box{max-width:560px;background:white;border-radius:18px;padding:36px;box-shadow:0 12px 40px #0001;text-align:center}h1{color:#173d2b}.small{color:#69746c}.btn{display:inline-block;background:#c69b52;color:white;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold}</style></head><body><div class="box"><h1>Ödəniş yoxlanılır</h1><p id="msg">Ödəniş provayderinin son təsdiqini gözləyirik. Bu səhifə açıq qala bilər.</p><p id="code" class="small"></p><a class="btn" href="/">Ana səhifəyə qayıt</a></div><script>const code=new URLSearchParams(location.search).get('code');document.getElementById('code').textContent=code?'Rezervasiya kodu: '+code:'';async function poll(){if(!code)return;try{const r=await fetch('/.netlify/functions/booking-status?code='+encodeURIComponent(code));const d=await r.json();if(r.ok){if(d.status==='confirmed'){document.getElementById('msg').textContent='Ödəniş uğurla təsdiqləndi. Rezervasiyanız təsdiqlənib.';return}if(d.status==='payment_review'){document.getElementById('msg').textContent='Ödəniş alınıb, amma rezervasiyanın əl ilə yoxlanılması lazımdır. Zəhmət olmasa 050 369 90 00 nömrəsi ilə əlaqə saxlayın.';return}if(['payment_failed','cancelled','expired'].includes(d.status)){document.getElementById('msg').textContent='Ödəniş tamamlanmayıb. Yenidən rezervasiya etmək və ya bizimlə əlaqə saxlamaq mümkündür.';return}}}catch(e){}setTimeout(poll,2500)}poll();</script></body></html>
