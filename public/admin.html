<style>
:root{--dark:#17372c;--green:#26704e;--bg:#f3f6f4;--white:#fff;--muted:#718078;--border:#e5ebe7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#24352d}
button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--dark);color:white;padding:25px 15px;flex-shrink:0}
.logo{font-size:21px;font-weight:800;padding:8px 10px 30px}

.nav-title{font-size:10px;color:#91aa9d;padding:12px}
.nav{width:100%;display:block;border:0;background:transparent;color:#d8e6de;text-align:left;padding:13px;border-radius:8px;margin:3px 0;font-size:14px}
.nav:hover,.nav.active{background:#315d49;color:white}
.main{flex:1;min-width:0;padding:28px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:12px}

.sub{font-size:13px;color:var(--muted);margin-top:7px}
.date{font-size:13px;color:var(--muted)}
.section{display:none}
.section.active{display:block}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.card{background:white;border:1px solid var(--border);border-radius:13px;padding:20px}
.card-label{font-size:13px;color:var(--muted)}
.card-value{font-size:25px;font-weight:750;margin-top:13px}
.card-note{font-size:11px;color:#829087;margin-top:8px}
.panel{background:white;border:1px solid var(--border);border-radius:13px;padding:21px;margin-top:20px}
.panel h3{margin:0 0 15px;font-size:16px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick button{background:#f2f7f3;border:1px solid var(--border);border-radius:10px;padding:17px;text-align:left;color:var(--dark)}
.quick strong{display:block;margin-bottom:6px}
.quick span{font-size:12px;color:var(--muted)}
.notice{padding:14px;background:#f7f8f5;border-radius:9px;color:#66756c;font-size:13px;line-height:1.6}
.btn{border:0;background:var(--green);color:white;padding:11px 16px;border-radius:8px}
.btn:hover{background:var(--dark)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
th,td{text-align:left;padding:13px 9px;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px}
.link{color:var(--green);text-decoration:none;font-weight:bold}
#financeFrame{min-height:1800px}
@media(max-width:620px){#financeFrame{height:2200px;min-height:2200px}}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.sidebar{width:210px}}
@media(max-width:620px){
.app{display:block}
.sidebar{width:100%;padding:14px}

.nav-title{display:none}

.main{padding:15px}

h1{font-size:21px}

/* Desktop reservation calendar and active reservation shortcut */
.qth-calendar-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.qth-calendar-heading h3{margin-bottom:6px}
.qth-calendar-heading .sub{max-width:720px;line-height:1.5}
.qth-calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 15px}
.qth-calendar-month-control{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qth-calendar-month-control label{font-size:12px;color:#68736b}
.qth-calendar-month-control input{width:155px;padding:9px 10px;border:1px solid #ded8ca;border-radius:9px;background:#fffefa;color:#24362d}
.qth-calendar-step{width:38px;height:36px;border:1px solid #d8caa8!important;border-radius:9px!important;background:#f7f3e9!important;color:#745f36!important;font-size:20px!important;font-weight:700}
.qth-calendar-summary{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin:12px 0}
.qth-calendar-summary>div{min-width:155px;padding:10px 13px;border:1px solid #e7e0d1;border-radius:11px;background:#faf9f5}
.qth-calendar-summary strong{display:block;color:#274f39;font-size:20px;line-height:1.1}
.qth-calendar-summary span{display:block;margin-top:5px;color:#788078;font-size:10px}
.qth-calendar-summary p{flex:1;align-self:center;margin:0 0 0 5px;color:#7b847d;font-size:11px}
.qth-calendar-legend{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin:13px 0;color:#6f786f;font-size:11px}
.qth-calendar-legend>span{display:inline-flex;align-items:center;gap:6px}
.qth-legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.qth-legend-confirmed{background:#208456}.qth-legend-pending{background:#d19a35}.qth-legend-review{background:#3984a9}
.qth-calendar-hint{margin-left:auto;color:#93978d}
.qth-calendar-scroll{max-width:100%;overflow:auto;border:1px solid #e3dfd5;border-radius:12px;max-height:680px;background:#fffefa}
.qth-reservation-calendar{width:max-content!important;min-width:100%!important;border-collapse:separate!important;border-spacing:0!important;table-layout:fixed}
.qth-reservation-calendar th,.qth-reservation-calendar td{padding:4px!important;border-right:1px solid #eeece5!important;border-bottom:1px solid #eae7df!important;text-align:center!important;vertical-align:middle!important;min-width:39px!important;height:42px}
.qth-reservation-calendar thead th{position:sticky;top:0;z-index:4;background:#f5f2e9!important;color:#6c746b!important}
.qth-reservation-calendar .qth-calendar-unit-head,.qth-reservation-calendar .qth-calendar-unit-name{position:sticky;left:0;z-index:5;width:158px;min-width:158px!important;text-align:left!important;background:#f8f6f0!important;padding:8px 12px!important;color:#263e30!important;font-weight:750}
.qth-reservation-calendar .qth-calendar-unit-name{z-index:2}
.qth-calendar-unit-name small{display:block;color:#8a9188;font-size:10px;font-weight:500;margin-top:4px}
.qth-calendar-date-head strong{display:block;font-size:12px;color:#3d4a40}
.qth-calendar-date-head small{display:block;font-size:9px;color:#92978e;font-weight:500}
.qth-calendar-empty{background:#fffefa!important}
.qth-calendar-occupied{padding:2px!important;background:#f2f5f0!important}
.qth-calendar-has-confirmed{background:#e5f2e9!important}
.qth-calendar-has-pending{background:#fff4de!important}
.qth-calendar-has-review{background:#e8f2f7!important}
.qth-calendar-has-staying{background:#e7f1f7!important}
.qth-calendar-has-checkout{background:#eceeeb!important}
.qth-calendar-booking{display:block;width:100%;min-width:0;min-height:29px;margin:1px 0;padding:4px 2px;border:0!important;border-radius:5px!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px!important;font-weight:750!important;cursor:pointer}
.qth-calendar-booking--confirmed{background:#208456!important;color:#fff!important}
.qth-calendar-booking--pending{background:#d19a35!important;color:#2d2414!important}
.qth-calendar-booking--review{background:#3984a9!important;color:#fff!important}
.qth-calendar-booking--staying{background:#2878a8!important;color:#fff!important}
.qth-calendar-booking--checkout{background:#6e7771!important;color:#fff!important}
.qth-calendar-booking--checkin{background:#208456!important;color:#fff!important}
.qth-calendar-booking:hover{filter:brightness(1.08);box-shadow:0 2px 6px #243a2a22}
.qth-active-reservation-filter{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px!important;border:1px solid #197348!important;border-radius:9px!important;background:linear-gradient(135deg,#1b8956,#12663f)!important;color:#fff!important;font-size:12px!important;font-weight:800!important;box-shadow:0 4px 12px #176c4426}
.qth-active-reservation-filter:hover{background:#0d5b37!important}
.qth-reservation-quick-actions{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px}
.qth-reservation-quick-actions>button:first-child{border:1px solid #d7d2c5!important;border-radius:9px!important;background:#f8f7f2!important;color:#4e5b51!important;padding:9px 13px}
@media(max-width:700px){
 .qth-calendar-heading{display:block}
 .qth-calendar-heading .qth-active-reservation-filter{margin-top:8px}
 .qth-calendar-summary>div{min-width:calc(50% - 8px);flex:1}
 .qth-calendar-summary p{flex-basis:100%;margin:4px 0}
 .qth-calendar-hint{margin-left:0}
 .qth-calendar-scroll{max-height:520px}
 .qth-reservation-calendar .qth-calendar-unit-head,.qth-reservation-calendar .qth-calendar-unit-name{width:125px;min-width:125px!important}
 .qth-reservation-calendar th,.qth-reservation-calendar td{min-width:35px!important}
}


/* House performance analytics */
.qth-house-performance-panel{margin-top:18px}
.qth-house-performance-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.qth-house-performance-heading h3{margin:0 0 5px}
.qth-house-performance-heading label{display:grid;gap:5px;font-size:11px;color:var(--muted)}
.qth-house-performance-heading input{padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text)}
.qth-house-performance-controls{display:flex;align-items:end;gap:8px;flex-wrap:wrap}
.qth-house-performance-controls button{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font-weight:700;cursor:pointer}
.qth-house-winners{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qth-house-winner{position:relative;min-height:152px;padding:16px;border:1px solid var(--border);border-radius:13px;background:var(--surface);display:flex;flex-direction:column;gap:5px;overflow:hidden}
.qth-house-winner-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--surface-2);font-weight:900}
.qth-house-winner-label{font-size:11px;color:var(--muted);margin-top:5px}
.qth-house-winner strong{font-size:18px;color:var(--text);line-height:1.25}
.qth-house-winner span{font-size:14px;font-weight:800;color:var(--text)}
.qth-house-winner small{font-size:10px;color:var(--muted);line-height:1.4}
.qth-house-winner--gold{border-color:#c7ad75}
.qth-house-winner--gold .qth-house-winner-icon{background:#f4ead3;color:#87662b}
.qth-house-winner--green{border-color:#9bbca4}
.qth-house-winner--green .qth-house-winner-icon{background:#e4efe7;color:#27613f}
.qth-house-winner--weak{border-color:#d9b3a9}
.qth-house-winner--weak .qth-house-winner-icon{background:#f4e7e4;color:#985b50}
.qth-house-performance-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0;padding:14px;border-radius:11px;background:var(--surface-2)}
.qth-house-performance-stats div{display:grid;gap:5px}
.qth-house-performance-stats small{font-size:10px;color:var(--muted)}
.qth-house-performance-stats strong{font-size:16px;color:var(--text)}
.qth-house-performance-table-wrap h4{margin:12px 0}
.qth-house-performance-table{min-width:900px!important;width:100%;border-collapse:collapse}
.qth-house-performance-table th,.qth-house-performance-table td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;white-space:nowrap}
.qth-house-performance-table th{color:var(--muted);font-weight:700}
.qth-house-share{min-width:90px;display:flex;align-items:center;gap:7px}
.qth-house-share span{min-width:35px}
.qth-house-share i{display:block;width:45px;height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.qth-house-share b{display:block;height:100%;background:#b69a60;border-radius:9px}
.qth-house-weak-row{background:rgba(190,112,92,.07)}
.qth-house-weak-label{display:block;margin-top:4px;color:#a45c4e;font-size:9px;font-weight:800}
.qth-house-performance-note{margin-top:12px;line-height:1.55}
@media(max-width:850px){.qth-house-winners{grid-template-columns:1fr 1fr}.qth-house-performance-stats{grid-template-columns:1fr 1fr}.qth-house-winner--weak{grid-column:1/-1}}
@media(max-width:600px){.qth-house-winners{grid-template-columns:1fr}.qth-house-winner--weak{grid-column:auto}.qth-house-performance-stats{grid-template-columns:1fr 1fr}.qth-house-performance-heading{display:block}.qth-house-performance-heading label{margin-top:12px;max-width:180px}.qth-house-winner{min-height:130px}}


/* Current-month expense donut — QTH premium dashboard */
.qth-payroll-panel{margin:0 0 20px;padding:22px 24px;background:linear-gradient(145deg,#fffefa,#f8f7f0);border:1px solid #e7e1d3;border-radius:18px;box-shadow:0 12px 30px rgba(43,55,43,.055)}
.qth-payroll-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qth-payroll-stat{background:#fff;border:1px solid #ece8dd;border-radius:13px;padding:16px;min-width:0}
.qth-payroll-stat span{display:block;color:#68766b;font-size:12px;line-height:1.4;min-height:32px}
.qth-payroll-stat strong{display:block;color:#294735;font-size:23px;letter-spacing:-.5px;margin:8px 0}
.qth-payroll-stat:nth-child(2) strong{color:#9a6b36}
.qth-payroll-stat:nth-child(3) strong{color:#527d61}
.qth-payroll-stat small{display:block;color:#92998f;font-size:10px;line-height:1.4}
@media(max-width:700px){.qth-payroll-panel{padding:17px 14px}.qth-payroll-grid{grid-template-columns:1fr}.qth-payroll-stat{padding:13px}.qth-payroll-stat span{min-height:0}.qth-payroll-stat strong{font-size:21px}}
.qth-expense-panel{margin:0 0 20px;padding:22px 24px;background:linear-gradient(145deg,#fffefa,#f8f7f0);border:1px solid #e7e1d3;border-radius:18px;box-shadow:0 12px 30px rgba(43,55,43,.055)}
.qth-expense-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.qth-expense-head h3{margin:0 0 5px;color:#304a38;font-size:18px}
.qth-expense-head p{margin:0;color:#7b837a;font-size:12px}
.qth-expense-month{white-space:nowrap;border:1px solid #d9cba9;border-radius:30px;padding:7px 11px;color:#80683b;background:#fbf8ef;font-size:11px;font-weight:700}
.qth-expense-layout{display:grid;grid-template-columns:minmax(210px, .9fr) minmax(250px,1.1fr);align-items:center;gap:26px}
.qth-expense-donut-wrap{display:flex;align-items:center;justify-content:center;min-height:230px}
.qth-expense-donut{width:218px;height:218px;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:0 12px 28px rgba(43,55,43,.12);transition:background .35s ease}
.qth-expense-donut:after{content:"";position:absolute;inset:27px;border-radius:50%;background:#fffefa;box-shadow:inset 0 2px 9px rgba(30,45,35,.06)}
.qth-expense-center{position:relative;z-index:1;text-align:center;padding:10px}
.qth-expense-center small{display:block;color:#879087;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:7px}
.qth-expense-center strong{display:block;color:#2d4937;font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.6px}
.qth-expense-center span{display:block;color:#9a8354;font-size:10px;margin-top:6px}
.qth-expense-legend{display:flex;flex-direction:column;gap:9px}
.qth-expense-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 11px;border:1px solid #efede5;border-radius:11px;background:#fff}
.qth-expense-dot{width:9px;height:9px;border-radius:50%}
.qth-expense-name{font-size:12px;color:#5d695f;min-width:0}
.qth-expense-value{text-align:right;font-size:12px;font-weight:800;color:#344b3a;white-space:nowrap}
.qth-expense-value small{display:block;color:#92998f;font-size:10px;font-weight:500;margin-top:2px}
.qth-expense-empty{grid-column:1/-1;text-align:center;color:#7d887e;background:#f7f7f1;border:1px dashed #dcded2;border-radius:12px;padding:24px 15px;font-size:13px}
.qth-expense-foot{margin-top:13px;padding-top:11px;border-top:1px solid #eeece4;color:#8b9288;font-size:10px;line-height:1.5}
@media(max-width:700px){.qth-expense-panel{padding:17px 14px}.qth-expense-layout{grid-template-columns:1fr;gap:8px}.qth-expense-donut-wrap{min-height:210px}.qth-expense-donut{width:194px;height:194px}.qth-expense-donut:after{inset:24px}.qth-expense-legend{gap:7px}.qth-expense-head h3{font-size:16px}}
