[build]
  command = "npm install && npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # This server-only credential is read at runtime inside Netlify Functions.
  # It is not embedded in public HTML/JS; allow the function bundle to retain it as an env lookup.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_ROLE_KEY"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/finance.html"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/utility-management.html"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/employee-payments.html"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"

[[redirects]]
  from = "/payment-success"
  to = "/payment-success.html"
  status = 200

[[redirects]]
  from = "/payment-error"
  to = "/payment-error.html"
  status = 200
